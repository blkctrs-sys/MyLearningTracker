<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learning Tracker</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#262b36;--tx:#e8eaf0;--mut:#8b93a7;--acc:#7c9cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:14px 16px 6px;max-width:900px;margin:0 auto}
h1{margin:0;font-size:20px}
#sub{color:var(--mut);font-size:13px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;max-width:900px;margin:0 auto;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{flex:none;background:var(--card);color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:inherit;cursor:pointer}
nav button.on{background:var(--acc);color:#0b0e16;border-color:var(--acc);font-weight:600}
main{max-width:900px;margin:0 auto;padding:8px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 14px}
.card h2{margin:0 0 10px;font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:600px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile b{display:block;font-size:22px}.tile span{color:var(--mut);font-size:12px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;background:#0f1218;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.btn{background:var(--acc);color:#0b0e16;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;margin-top:12px}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font:inherit;font-size:12px;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--mut);cursor:pointer;background:transparent}
.chip.on{color:#0b0e16;font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.item{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item small{color:var(--mut)}
.bar{height:9px;background:#0f1218;border-radius:6px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat div{aspect-ratio:1;border-radius:3px;background:#1b2029}
.weeks{display:flex;align-items:flex-end;gap:4px;height:130px}
.weeks .w{flex:1;display:flex;flex-direction:column-reverse;min-width:6px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mut);margin-top:8px}
a{color:var(--acc)}
.st{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);cursor:pointer;background:none;color:var(--mut)}
.st.doing{color:#ffb454;border-color:#ffb454}.st.done{color:#5fd39a;border-color:#5fd39a}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);cursor:pointer;background:none;color:var(--mut);margin-right:4px}
.pill.on{background:#5fd39a;color:#0b0e16;border-color:#5fd39a}
.muted{color:var(--mut)}
.clock{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px;margin:4px 0}
.hint{background:#0f1218;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:13px;margin-top:8px}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns .btn{margin-top:10px}
button.btn.alt{background:transparent;color:var(--tx);border:1px solid var(--line)}
#tm{background:none;border:0;color:var(--acc);font:inherit;font-size:13px;cursor:pointer;padding:0;margin-left:8px}
.dom{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.dom:first-of-type{border-top:0}
.lv{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);cursor:pointer;background:none;color:var(--mut);flex:none;min-width:92px}
.lv.l1{color:#ffb454;border-color:#ffb454}.lv.l2{color:#5fd39a;border-color:#5fd39a}
.weak{font-size:11px;color:#ff6b81;margin-left:6px}
#tip{position:fixed;z-index:20;pointer-events:none;background:#0b0e16;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;display:none;max-width:220px}
.chart text{fill:var(--mut);font-size:11px}
code{font-size:12px}
.note-body{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px}
.chip .n{opacity:.7;margin-left:4px}
</style>
</head>
<body>
<header><h1>Learning Tracker</h1><div id="sub"></div></header>
<nav id="nav"></nav>
<main id="view"></main>
<input type="file" id="imp" accept="application/json" hidden>
<div id="tip"></div>
<script>
const TOPICS=[
 {id:'aplus',name:'CompTIA A+',color:'#4da3ff'},
 {id:'neosoul',name:'Neo Soul (Pickup)',color:'#c58bff'},
 {id:'drawing',name:'Drawing: People',color:'#ffb454'},
 {id:'rigging',name:'Blender: Character Creation',color:'#5fd39a'},
 {id:'unreal',name:'Unreal + Dodgeball',color:'#ff6b81'}
];
const TN=Object.fromEntries(TOPICS.map(t=>[t.id,t]));
const KEY='learning-tracker-v1';
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const weekStart=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
const today=()=>ymd(new Date());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=m=>m<60?`${m}m`:`${Math.floor(m/60)}h${m%60?` ${m%60}m`:''}`;
const $=s=>document.querySelector(s);

const SEED_RES=[
 ['aplus','CompTIA A+ exam objectives','https://www.comptia.org/certifications/a','Download the objectives PDF and tick topics off as you go'],
 ['aplus','Professor Messer A+ course','https://www.professormesser.com/',''],
 ['neosoul','Pickup Music: Neo Soul course','https://www.pickupmusic.com/','Log which lesson you finished in the session note'],
 ['drawing','Proko (figure drawing)','https://www.proko.com/',''],
 ['drawing','Line of Action (timed gesture poses)','https://line-of-action.com/','Great for daily 15-minute warm-ups'],
 ['rigging','Blender Manual (search "Rigging" / "Rigify")','https://docs.blender.org/manual/en/latest/',''],
 ['rigging','Blender Studio','https://studio.blender.org/','Character rigging training and production files'],
 ['unreal','Epic Developer Community: Learning','https://dev.epicgames.com/community/learning',''],
 ['unreal','Unreal Engine documentation','https://dev.epicgames.com/documentation/en-us/unreal-engine/',''],
 // Added in seed version 2 (merged into existing saved data on load)
 ['drawing','Proko: Figure Drawing Fundamentals','https://www.proko.com/course/figure-drawing-fundamentals','Structured course: gesture, form, proportion. Many lessons free on YouTube',2],
 ['drawing','Proko on YouTube','https://www.youtube.com/@ProkoTV','Free anatomy and figure lessons',2],
 ['drawing','Drawabox (free fundamentals)','https://drawabox.com/','Lines, boxes, construction. Pair with gesture practice',2],
 ['drawing','Quickposes (timed pose reference)','https://quickposes.com/','Full figures, hands, faces. Alternative to Line of Action',2],
 ['drawing','Posemaniacs (3D pose & anatomy reference)','https://www.posemaniacs.com/','Rotate poses to study the body from any angle',2],
 ['drawing','Love Life Drawing (YouTube)','https://www.youtube.com/@LoveLifeDrawing','Beginner-friendly figure and portrait tutorials',2],
 ['drawing','Sinix Design (YouTube)','https://www.youtube.com/@SinixDesign','Anatomy shortcuts and character design',2],
 ['drawing','Character Design References','https://www.characterdesignreferences.com/','Inspiration and studies for designing your own characters',2],
 ['drawing','Book: Figure Drawing: Design and Invention (Michael Hampton)','','Clear, construction-based approach to the figure',2],
 ['rigging','Blender Studio: Introduction to Rigging','https://studio.blender.org/training/humane-rigging/','Start here: bones, weights, constraints',2],
 ['rigging','Blender Studio: Rigging Fundamentals','https://studio.blender.org/training/rigging-fundamentals/','',2],
 ['rigging','Blender Studio: Stylized Character Workflow','https://studio.blender.org/training/stylized-character-workflow/','Model, sculpt and rig a full character start to finish',2],
 ['rigging','Blender Studio: Blender Fundamentals','https://studio.blender.org/training/blender-2-8-fundamentals/','Interface and core tools if anything feels unfamiliar',2],
 ['rigging','Blender Manual: Armatures','https://docs.blender.org/manual/en/latest/animation/armatures/index.html','Reference for bones, posing and skinning',2],
 ['rigging','Blender Manual: Rigify (4.1 docs)','https://docs.blender.org/manual/en/4.1/addons/rigging/rigify/index.html','Auto-rig a humanoid. Rigify is now an extension but works the same',2],
 ['rigging','CGDive (YouTube)','https://www.youtube.com/@CGDive','Rigging-focused channel: Rigify, game rigs, Unreal export',2],
 ['rigging','Grant Abbitt (YouTube)','https://www.youtube.com/@grabbitt','Beginner character modeling series',2],
 ['rigging','CG Boost (YouTube)','https://www.youtube.com/@CGBoost','Blender beginner and character projects',2],
 ['rigging','Mixamo (free auto-rig + animations)','https://www.mixamo.com/','Quick way to test a model in motion; compare to your own rig',2],
 ['rigging','CG Cookie (paid)','https://cgcookie.com/','Structured Blender courses incl. character rigging',2],
 // seed version 3: modeling and sculpting
 ['rigging','Blender Manual: Mesh modeling','https://docs.blender.org/manual/en/latest/modeling/meshes/index.html','Reference for edit-mode tools (extrude, loop cut, bevel)',3],
 ['rigging','Blender Manual: Sculpting','https://docs.blender.org/manual/en/latest/sculpt_paint/sculpting/index.html','Brushes, dynamic topology, remeshing',3],
 ['rigging','Ryan King Art (YouTube)','https://www.youtube.com/@ryankingart','Beginner-friendly modeling and character tutorials',3],
 ['rigging','YanSculpts (YouTube)','https://www.youtube.com/@YanSculpts','Character sculpting in Blender: heads, bodies, stylized characters',3]
];
const SEED_V=3;
const DEFAULT_GOALS={aplus:210,neosoul:120,drawing:300,rigging:300,unreal:180};
const OLD_GOALS={aplus:240,neosoul:150,drawing:240,rigging:180,unreal:360};
const REVIEW_DAYS=[1,3,7,21,60];
// CompTIA A+ V15 (220-1201 / 220-1202). Weights per CompTIA's published objectives; check the official PDF.
const APLUS={
 c1:{name:'Core 1',code:'220-1201',pass:675,color:'#3b8fe8',doms:[['c1m','Mobile Devices',13],['c1n','Networking',23],['c1h','Hardware',25],['c1v','Virtualization & Cloud Computing',11],['c1t','Hardware & Network Troubleshooting',28]]},
 c2:{name:'Core 2',code:'220-1202',pass:700,color:'#c27c10',doms:[['c2o','Operating Systems',28],['c2s','Security',28],['c2t','Software Troubleshooting',23],['c2p','Operational Procedures',21]]}
};
const LV=['not started','learning','confident'];
const seedRes=r=>({id:uid(),topic:r[0],title:r[1],url:r[2],note:r[3],status:'todo'});
function fresh(){
 return {settings:{start:'2026-11-13',end:'2027-03-13',goals:{...DEFAULT_GOALS}},
  logs:[],checks:[],clips:[],notes:[],next:{},modified:0,goalsV:2,aplus:{c1date:'',c2date:'',target:85,dom:{},practice:[]},
  resources:SEED_RES.map(seedRes),seedV:SEED_V};
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.settings)S=fresh();
// Upgrades older saved data / backups. Does not count as a user change for sync.
function migrate(){
 S.notes=S.notes||[];S.next=S.next||{};
 S.aplus=Object.assign({c1date:'',c2date:'',target:85,dom:{},practice:[]},S.aplus||{});S.logs=S.logs||[];S.checks=S.checks||[];S.clips=S.clips||[];S.resources=S.resources||[];
 S.notes.forEach(n=>{if(n.due===undefined){n.step=0;n.due=addDays(today(),1)}});
 if((S.seedV||1)<SEED_V){
  const have=new Set(S.resources.map(r=>r.topic+'|'+(r.url||r.title)));
  SEED_RES.filter(r=>(r[4]||1)>(S.seedV||1)&&!have.has(r[0]+'|'+(r[2]||r[1]))).forEach(r=>S.resources.push(seedRes(r)));
  S.seedV=SEED_V;
 }
 if(!S.goalsV){
  if(TOPICS.every(t=>S.settings.goals[t.id]===OLD_GOALS[t.id]))S.settings.goals={...DEFAULT_GOALS};
  S.goalsV=2;
 }
}
migrate();saveLocal();
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){S.modified=Date.now();saveLocal();schedulePush()}
const hasData=x=>!!x&&((x.logs||[]).length+(x.notes||[]).length+(x.checks||[]).length+(x.clips||[]).length)>0;

/* ---------- GitHub sync (data file in a private repo) ---------- */
const SKEY='learning-tracker-sync';
let SY={};try{SY=JSON.parse(localStorage.getItem(SKEY))||{}}catch(e){}
let syncMsg='',syncErr=false,pushTimer=null,pushing=false,pushAgain=false;
const syncOn=()=>!!(SY.owner&&SY.repo&&SY.token);
const saveSY=()=>{try{localStorage.setItem(SKEY,JSON.stringify(SY))}catch(e){}};
const b64e=str=>{const b=new TextEncoder().encode(str);let r='';for(let i=0;i<b.length;i+=8192)r+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(r)};
const b64d=str=>new TextDecoder().decode(Uint8Array.from(atob(str.replace(/\s/g,'')),c=>c.charCodeAt(0)));
function gh(method,body){
 const path=(SY.path||'data.json').split('/').map(encodeURIComponent).join('/');
 return fetch(`https://api.github.com/repos/${encodeURIComponent(SY.owner)}/${encodeURIComponent(SY.repo)}/contents/${path}`,
  {method,cache:'no-store',headers:{Authorization:'Bearer '+SY.token,Accept:'application/vnd.github+json'},body});
}
// Refresh only what's safe: never redraw a form the user is typing in.
function softRender(){const a=document.activeElement;if(a&&a.matches('input,textarea,select')&&a.closest('main'))updSub();else render()}
function setSync(ok,msg){syncErr=!ok;syncMsg=msg;if(ok){SY.lastSync=Date.now();saveSY()}softRender()}
function ghError(r){return r.status===401?'GitHub rejected the token (expired or wrong).':r.status===404?'Repo or file not found. Check the owner/repo name and that the token can access it.':r.status===403?'Token lacks permission (needs Contents: read and write).':'GitHub error '+r.status}
async function fetchRemote(){
 const r=await gh('GET');
 if(r.status===404){const m=await r.json().catch(()=>({}));if(/not found/i.test(m.message||'')&&SY.repoOk)return null;
  const chk=await fetch(`https://api.github.com/repos/${encodeURIComponent(SY.owner)}/${encodeURIComponent(SY.repo)}`,{cache:'no-store',headers:{Authorization:'Bearer '+SY.token}});
  if(chk.ok){SY.repoOk=true;return null}throw ghError(chk)}
 if(!r.ok)throw ghError(r);
 const j=await r.json();SY.sha=j.sha;return JSON.parse(b64d(j.content));
}
function adopt(remote){S=remote;migrate();saveLocal();SY.base=S.modified||0;saveSY();render()}
// Both sides changed since the last sync: keep everything from both (newer side wins for the same item / settings).
function merge(a,b){
 const nw=(a.modified||0)>=(b.modified||0)?a:b, old=nw===a?b:a, out={...nw};
 ['logs','notes','checks','clips','resources'].forEach(k=>{const m=new Map((old[k]||[]).map(x=>[x.id,x]));(nw[k]||[]).forEach(x=>m.set(x.id,x));out[k]=[...m.values()]});
 out.next={...(old.next||{}),...(nw.next||{})};
 if(nw.aplus||old.aplus){const oa=old.aplus||{},na=nw.aplus||{},m=new Map((oa.practice||[]).map(x=>[x.id,x]));(na.practice||[]).forEach(x=>m.set(x.id,x));
  out.aplus={...oa,...na,dom:{...(oa.dom||{}),...(na.dom||{})},practice:[...m.values()]}}
 out.modified=Date.now();return out;
}
const localChanged=()=>(S.modified||0)!==(SY.base||0);
async function pull(){
 if(!syncOn())return;
 try{
  const remote=await fetchRemote();
  if(!remote){SY.sha=null;await push();return}
  const rm=remote.modified||0;
  if(!SY.lastSync){ // first connection on this device
   if(hasData(S)&&hasData(remote)){
    const c=x=>`${x.logs.length} sessions, ${(x.notes||[]).length} notes`;
    if(confirm(`GitHub already has data (${c(remote)}).\nThis browser has ${c(S)}.\n\nOK = combine both (recommended).\nCancel = just load GitHub's copy into this browser.`)){S=merge(S,remote);migrate();saveLocal();render();await push();return}
    adopt(remote);
   }else if(hasData(S)){S.modified=Date.now();saveLocal();await push();return}
   else adopt(remote);
  }else if(rm!==(SY.base||0)){ // changed on another device
   if(localChanged()){S=merge(S,remote);migrate();saveLocal();render();await push();return}
   adopt(remote);
  }else if(localChanged()){await push();return}
  setSync(true,'Up to date');
 }catch(e){setSync(false,typeof e==='string'?e:'Could not reach GitHub (offline?)')}
}
function schedulePush(){if(!syncOn())return;clearTimeout(pushTimer);pushTimer=setTimeout(push,4000)}
async function push(){
 if(!syncOn())return;clearTimeout(pushTimer);pushTimer=null;
 if(pushing){pushAgain=true;return}pushing=true;
 try{
  for(let attempt=0;attempt<3;attempt++){
   const sent=S.modified||0, body={message:'Update learning data',content:b64e(JSON.stringify(S))};if(SY.sha)body.sha=SY.sha;
   const r=await gh('PUT',JSON.stringify(body));
   if(r.ok){const j=await r.json();SY.sha=j.content.sha;SY.base=sent;setSync(true,'Saved to GitHub');break}
   if((r.status===409||r.status===422)&&attempt<2){ // another device saved first: combine and retry
    const remote=await fetchRemote();if(remote){S=merge(S,remote);migrate();saveLocal();render()}continue;
   }
   throw ghError(r);
  }
 }catch(e){setSync(false,typeof e==='string'?e:'Could not reach GitHub (offline?). Will retry on next change.')}
 finally{pushing=false;if(pushAgain){pushAgain=false;push()}}
}
document.addEventListener('visibilitychange',()=>{if(!syncOn())return;if(document.hidden){if(pushTimer)push()}else if(!pushTimer&&!pushing)pull()});
window.addEventListener('online',()=>{if(syncOn())pull()});

/* ---------- focus timer (per device) ---------- */
const TKEY='learning-tracker-timer';
let T=null;try{T=JSON.parse(localStorage.getItem(TKEY))}catch(e){}
const saveT=()=>{try{T?localStorage.setItem(TKEY,JSON.stringify(T)):localStorage.removeItem(TKEY)}catch(e){}};
let fLen=25, sugOpen=false, sIdx=0, breakOver=false, rShow=false, AC=null;
const clock=ms=>{const t=Math.max(0,Math.ceil(ms/1000));return `${Math.floor(t/60)}:${pad(t%60)}`};
function ding(){try{if(!AC)return;[0,.35,.7].forEach(o=>{const g=AC.createGain(),os=AC.createOscillator();os.frequency.value=880;os.connect(g);g.connect(AC.destination);
 g.gain.setValueAtTime(.0001,AC.currentTime+o);g.gain.exponentialRampToValueAtTime(.3,AC.currentTime+o+.02);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+o+.3);os.start(AC.currentTime+o);os.stop(AC.currentTime+o+.32)})}catch(e){}
 try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function notify(msg){try{if(document.hidden&&'Notification' in window&&Notification.permission==='granted')new Notification('Learning Tracker',{body:msg})}catch(e){}}
function tick(){
 const hd=$('#tm');
 if(!T||T.mode==='wrap'||T.mode==='done'){if(hd)hd.textContent=T?.mode==='wrap'?'⏱ session done: log it':'';document.title='Learning Tracker';return}
 const rem=T.paused!=null?T.paused:T.end-Date.now();
 if(rem<=0&&T.paused==null){
  if(T.mode==='focus'){T={mode:'wrap',topic:T.topic,min:T.planned};notify(`${TN[T.topic].name}: time's up. Log what you learned.`)}
  else{T=null;breakOver=true;notify('Break over. Ready for another round?')}
  saveT();ding();tab='log';render();return;
 }
 const c=clock(rem),el=$('#tmr');if(el)el.textContent=c;
 if(hd)hd.textContent=`${T.mode==='focus'?'⏱':'☕'} ${c}${T.paused!=null?' (paused)':''}`;
 document.title=`${c} · ${T.mode==='focus'?TN[T.topic].name:'Break'}`;
}
setInterval(tick,500);
function showTip(el,x,y){const tp=$('#tip');tp.innerHTML=el.dataset.tip;tp.style.display='block';const w=tp.offsetWidth;tp.style.left=Math.min(innerWidth-w-8,Math.max(8,x-w/2))+'px';tp.style.top=(y-tp.offsetHeight-12)+'px'}
document.addEventListener('pointerover',e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el,e.clientX,e.clientY)});
document.addEventListener('pointerout',e=>{if(e.target.closest&&e.target.closest('[data-tip]'))$('#tip').style.display='none'});
document.addEventListener('scroll',()=>{$('#tip').style.display='none'},true);

/* ---------- what next? ---------- */
function suggestions(){
 const t=today(),wt=weekTotals(weekStart(t)),frac=(((parse(t).getDay()+6)%7)+1)/7;
 const lastToday=[...S.logs].filter(l=>l.date===t).sort((a,b)=>b.id.localeCompare(a.id))[0];
 const L=TOPICS.filter(x=>(S.settings.goals[x.id]||0)>0).map(x=>{const g=S.settings.goals[x.id];return {x,g,done:wt[x.id],behind:g*frac-wt[x.id],ratio:wt[x.id]/g}})
  .sort((a,b)=>b.behind-a.behind||a.ratio-b.ratio);
 if(lastToday&&L.length>1&&L[0].x.id===lastToday.topic&&L[1].behind>0)L.push(L.shift()); // encourage switching
 return L;
}

/* ---------- shared helpers ---------- */
function addSession(topic,date,min,note,rec,learned,next){
 S.logs.push({id:uid(),date,topic,min,note:note.trim(),rec:!!rec});
 if(rec)S.clips.push({id:uid(),date,topic,title:`${TN[topic].name}${note.trim()?': '+note.trim().slice(0,60):' session'}`,edited:false,yt:false,tw:false,ig:false});
 if(learned&&learned.trim())S.notes.push(newNote(topic,'',learned));
 if(next!==undefined){if(next.trim())S.next[topic]=next.trim();else delete S.next[topic]}
}
function newNote(topic,title,body){return {id:uid(),topic,date:today(),updated:today(),title:title.trim(),body:body.trim(),step:0,due:addDays(today(),1)}}
const dueNotes=()=>S.notes.filter(n=>n.due&&n.due<=today()).sort((a,b)=>a.due.localeCompare(b.due));

let tab='log', fTopic=TOPICS[0].id, fMin=30, nTopic=TOPICS[0].id, nEdit=null;
const drafts={};
const TABS=[['log','Log'],['dash','Progress'],['exam','A+ Exam'],['res','Resources'],['notes','Notes'],['chk','Checkpoints'],['content','Content']];

function byDay(){const m={};S.logs.forEach(l=>m[l.date]=(m[l.date]||0)+l.min);return m}
function streak(){
 const m=byDay();let d=today();if(!m[d])d=addDays(d,-1);
 let n=0;while(m[d]){n++;d=addDays(d,-1)}return n;
}
function weekTotals(ws){const o=Object.fromEntries(TOPICS.map(t=>[t.id,0]));
 const we=addDays(ws,6);S.logs.forEach(l=>{if(l.date>=ws&&l.date<=we)o[l.topic]+=l.min});return o}

  return `<div class="card"><h2>Logged. Take a break</h2><div class="muted" style="font-size:13px">Stand up, look away from the screen, get water.${r>=4&&r%4===0?' That\'s 4 sessions in a row, so take a longer break.':''}</div>

 if(T&&T.mode==='break')return `<div class="card"><h2>☕ Break</h2><div class="clock" id="tmr">${clock(T.paused!=null?T.paused:T.end-Date.now())}</div>

 const L=suggestions(), sg=L.length?L[sIdx%L.length]:null;

   <div class="btns"><button class="btn" data-a="su" data-v="${sg.x.id}">Do this</button><button class="btn alt" data-a="sa">Something else</button></div></div>`:''}

function heat(){
 const {start,end}=S.settings;const m=byDay();const t=today();
 let d=weekStart(start),cells='';
 while(d<=end){
  const v=m[d]||0;
  const a=v===0?0:v<30?.25:v<90?.5:v<180?.75:1;
  const out=d<start||d>end, fut=d>t;
  cells+=`<div title="${d}: ${fmt(v)}" style="${a?`background:rgba(124,156,255,${a})`:''};${out||fut?'opacity:.35':''}"></div>`;
  d=addDays(d,1);
 }
 return `<div class="heat">${cells}</div><div class="muted" style="font-size:12px;margin-top:6px">Each column is a week (Mon–Sun). Brighter = more minutes.</div>`;
}

function vDash(){
 const t=today(), ws=weekStart(t), wt=weekTotals(ws), m=byDay();
 const wkSum=Object.values(wt).reduce((a,b)=>a+b,0);
 const left=Math.max(0,Math.ceil((parse(S.settings.end)-parse(t))/864e5));
 // weekly stacked bars
 const weeks=[];let w=weekStart(S.settings.start);const last=weekStart(t);
 while(w<=last&&weeks.length<30){weeks.push(w);w=addDays(w,7)}
 const wd=weeks.map(x=>({x,tot:weekTotals(x)}));
 const mx=Math.max(60,...wd.map(o=>Object.values(o.tot).reduce((a,b)=>a+b,0)));
 const allTime=Object.fromEntries(TOPICS.map(x=>[x.id,0]));S.logs.forEach(l=>allTime[l.topic]+=l.min);
 return `<div class="tiles">
  <div class="tile"><b>${fmt(m[t]||0)}</b><span>today</span></div>
  <div class="tile"><b>${streak()} 🔥</b><span>day streak</span></div>
  <div class="tile"><b>${fmt(wkSum)}</b><span>this week</span></div>
  <div class="tile"><b>${left}</b><span>days left</span></div></div>
 <div class="card"><h2>This week vs. goal</h2>${TOPICS.map(x=>{const g=(S.settings.goals[x.id]||0), p=g?Math.min(100,wt[x.id]/g*100):0;
  return `<div><div style="display:flex;justify-content:space-between"><span><span class="dot" style="background:${x.color}"></span>${esc(x.name)}</span><span class="muted">${fmt(wt[x.id])} / ${fmt(g)}</span></div><div class="bar"><i style="width:${p}%;background:${x.color}"></i></div></div>`}).join('')}</div>
 <div class="card"><h2>Consistency</h2>${heat()}</div>
 <div class="card"><h2>Weekly minutes by topic</h2><div class="weeks">${wd.map(o=>`<div class="w" title="Week of ${o.x}">${TOPICS.map(x=>`<div style="height:${o.tot[x.id]/mx*120}px;background:${x.color}"></div>`).join('')}</div>`).join('')}</div>
  <div class="legend">${TOPICS.map(x=>`<span><span class="dot" style="background:${x.color}"></span>${esc(x.name)}</span>`).join('')}</div></div>
 <div class="card"><h2>All-time hours</h2>${TOPICS.map(x=>`<div class="item"><span><span class="dot" style="background:${x.color}"></span>${esc(x.name)}</span><b>${(allTime[x.id]/60).toFixed(1)}h</b></div>`).join('')}</div>
 <div class="card"><h2>Settings</h2>
  <div class="row"><div><label>Start date</label><input type="date" data-set="start" value="${S.settings.start}"></div><div><label>End date</label><input type="date" data-set="end" value="${S.settings.end}"></div></div>
  <label>Weekly goals (minutes)</label>
  ${TOPICS.map(x=>`<div class="item" style="align-items:center"><span><span class="dot" style="background:${x.color}"></span>${esc(x.name)}</span><input type="number" style="width:90px" min="0" data-goal="${x.id}" value="${S.settings.goals[x.id]||0}"></div>`).join('')}
  <div class="chips" style="margin-top:12px"><button class="chip" data-a="exp">Export backup</button><button class="chip" data-a="imp">Import backup</button><button class="chip" data-a="reset">Reset everything</button></div>
  <div class="muted" style="font-size:12px;margin-top:8px">${syncOn()?'Backups are optional while GitHub sync is on, but a monthly export does no harm.':'Data lives in this browser. Turn on GitHub sync below, or export a backup weekly.'}</div></div>
 ${vSync()}`;
}

function scoreChart(){
 const P=S.aplus.practice.filter(x=>x.score!=='').sort((a,b)=>a.date.localeCompare(b.date)), tg=+S.aplus.target||0;
 if(!P.length)return '<div class="muted" style="font-size:13px">Add your first practice score below to start the trend line.</div>';
 const W=360,H=200,l=28,r=74,t=12,b=22, t0=parse(P[0].date)-0, t1=Math.max(parse(P[P.length-1].date)-0,t0+864e5*7);
 const lo=Math.max(0,Math.min(40,...P.map(x=>+x.score))-5);
 const X=d=>l+(parse(d)-t0)/(t1-t0)*(W-l-r), Y=v=>t+(100-v)/(100-lo)*(H-t-b);
 let g='';for(let v=Math.ceil(lo/20)*20;v<=100;v+=20)g+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#262b36"/><text x="${l-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
 if(tg)g+=`<line x1="${l}" x2="${W-r}" y1="${Y(tg)}" y2="${Y(tg)}" stroke="#8b93a7" stroke-dasharray="4 4"/><text x="${l+4}" y="${Y(tg)-5}">target ${tg}%</text>`;
 g+=`<text x="${l}" y="${H-6}">${esc(P[0].date)}</text><text x="${W-r}" y="${H-6}" text-anchor="end">${esc(ymd(new Date(t1)))}</text>`;
 const labels=[];
 ['c1','c2'].forEach(c=>{const pts=P.filter(x=>x.core===c);if(!pts.length)return;const col=APLUS[c].color;
  if(pts.length>1)g+=`<polyline fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" points="${pts.map(x=>X(x.date)+','+Y(+x.score)).join(' ')}"/>`;
  pts.forEach(x=>{g+=`<circle cx="${X(x.date)}" cy="${Y(+x.score)}" r="5" fill="${col}" stroke="#171a21" stroke-width="2"/><circle cx="${X(x.date)}" cy="${Y(+x.score)}" r="14" fill="transparent" data-tip="${esc(`${APLUS[c].name} · ${x.date}<br><b>${x.score}%</b>${x.source?' · '+esc(x.source):''}`)}"/>`});
  const last=pts[pts.length-1];labels.push({y:Y(+last.score),txt:`${APLUS[c].name} ${last.score}%`,x:W-r});
 });
 if(labels.length===2&&Math.abs(labels[0].y-labels[1].y)<15){const [a,bb]=labels[0].y<labels[1].y?labels:[labels[1],labels[0]];const m=(a.y+bb.y)/2;a.y=m-8;bb.y=m+8}
 labels.forEach(o=>g+=`<text x="${o.x+9}" y="${o.y+4}" style="fill:var(--tx)">${esc(o.txt)}</text>`);
 const used=['c1','c2'].filter(c=>P.some(x=>x.core===c));
 return `<div class="legend" style="margin:0 0 6px">${used.map(c=>`<span><span class="dot" style="background:${APLUS[c].color}"></span>${APLUS[c].name}</span>`).join('')}<span>┄ your target</span></div>
  <svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Practice exam scores over time">${g}</svg>`;
}
function vExam(){
 const A=S.aplus;
 const coreCard=c=>{const C=APLUS[c],rd=readiness(c),dl=daysTo(A[c+'date']);
  const left=C.doms.filter(d=>(A.dom[d[0]]||0)<2), weakN=id=>A.practice.filter(x=>x.weak===id).length;
  const next=[...left].sort((a,b)=>(weakN(b[0])-weakN(a[0]))||((A.dom[a[0]]||0)-(A.dom[b[0]]||0))||(b[2]-a[2]))[0];
  const best=Math.max(0,...A.practice.filter(x=>x.core===c).map(x=>+x.score||0));
  let plan='';
  if(!left.length)plan=`All domains marked confident. ${best>=A.target?'Practice scores are at target. You look ready to book it.':`Keep taking practice tests until you're consistently at ${A.target}%+.`}`;
  else if(dl!==null&&dl>0)plan=`${left.length} domain${left.length>1?'s':''} to go in ${dl} days, so roughly <b>one every ${Math.max(1,Math.floor((dl-14)/left.length))} days</b> (leaves the last 2 weeks for practice tests).`;
  else if(dl!==null&&dl<=0)plan='Exam date has passed. Update it above.';
  else plan='Set a target date above to get a pace.';
  return `<div class="card"><h2><span class="dot" style="background:${C.color}"></span>${C.name} (${C.code})${dl!==null&&dl>=0?` · ${dl} day${dl===1?'':'s'} to go`:''}</h2>
   <div style="display:flex;justify-content:space-between;font-size:13px"><span>Readiness (weighted by exam %)</span><b>${rd}%</b></div>
   <div class="bar"><i style="width:${rd}%;background:${C.color}"></i></div>
   ${C.doms.map(d=>{const v=A.dom[d[0]]||0,w=weakN(d[0]);return `<div class="dom"><div><div>${esc(d[1])}</div><small class="muted">${d[2]}% of exam</small>${w?`<span class="weak">weak in ${w} practice test${w>1?'s':''}</span>`:''}</div><button class="lv l${v}" data-a="ad" data-v="${d[0]}">${LV[v]}</button></div>`}).join('')}
   <div class="hint">${plan}${next?`<br>➡️ Next up: <b>${esc(next[1])}</b>`:''}</div>
   <div class="muted" style="font-size:12px;margin-top:8px">Real exam: up to 90 questions in 90 minutes, multiple choice and performance-based. Pass mark ${C.pass} on a 100–900 scale.</div></div>`};
 const prac=[...A.practice].sort((a,b)=>b.date.localeCompare(a.date));
 const domOpts=['c1','c2'].map(c=>`<optgroup label="${APLUS[c].name}">${APLUS[c].doms.map(d=>`<option value="${d[0]}">${esc(d[1])}</option>`).join('')}</optgroup>`).join('');
 return `<div class="card"><h2>Exam plan</h2>
  <div class="muted" style="font-size:13px">A+ is <b>two exams</b>. You need to pass both Core 1 and Core 2 from the same series. Most people take Core 1 first.</div>
  <div class="row"><div><label>Core 1 target date</label><input type="date" data-ax="c1date" value="${A.c1date}"></div><div><label>Core 2 target date</label><input type="date" data-ax="c2date" value="${A.c2date}"></div></div>
  <div class="muted" style="font-size:12px;margin-top:8px">Tap a domain's status to cycle: not started → learning → confident. Get the full objectives list from the "CompTIA A+ exam objectives" link in Resources.</div></div>
 ${coreCard('c1')}${coreCard('c2')}
 <div class="card"><h2>Practice test scores</h2>${scoreChart()}
  <form data-form="prac" style="margin-top:10px"><div class="row"><div><label>Exam</label><select name="core"><option value="c1">Core 1</option><option value="c2">Core 2</option></select></div>
  <div><label>Date</label><input type="date" name="date" value="${today()}" required></div></div>
  <div class="row"><div><label>Score (%)</label><input type="number" name="score" min="0" max="100" required></div><div><label>Weakest domain (optional)</label><select name="weak"><option value="">—</option>${domOpts}</select></div></div>
  <label>Which practice test?</label><input name="source" placeholder="e.g. Messer practice exam 1">
  <button class="btn">Add score</button></form>
  <div class="row" style="margin-top:12px;align-items:end"><div><label>Your target on practice tests (%)</label><input type="number" min="1" max="100" data-ax="target" value="${A.target}"></div><div class="muted" style="font-size:12px">A rule of thumb, not the official pass mark: book the exam once you score this consistently.</div></div>
  ${prac.length?`<div style="margin-top:10px">${prac.map(x=>`<div class="item"><div><span class="dot" style="background:${APLUS[x.core].color}"></span><b>${APLUS[x.core].name} · ${esc(x.score)}%</b>${x.source?` · ${esc(x.source)}`:''}<br><small>${esc(x.date)}${x.weak?` · weakest: ${esc((APLUS[x.weak.slice(0,2)].doms.find(d=>d[0]===x.weak)||[])[1]||'')}`:''}</small></div><button class="ghost" data-a="apd" data-v="${x.id}">✕</button></div>`).join('')}</div>`:''}</div>`;
}
const VIEWS={log:vLog,dash:vDash,exam:vExam,res:vRes,notes:vNotes,chk:vChk,content:vContent};

function render(){
 const dn=dueNotes().length;
 $('#nav').innerHTML=TABS.map(t=>`<button class="${t[0]===tab?'on':''}" data-a="tab" data-v="${t[0]}">${t[1]}${t[0]==='notes'&&dn?` (${dn})`:''}</button>`).join('');
 $('#view').innerHTML=VIEWS[tab]();
 updSub();
}
function updSub(){
 const n=S.logs.length;
 $('#sub').innerHTML=`${S.settings.start} → ${S.settings.end} · ${n} session${n===1?'':'s'} logged${syncOn()?` · <span title="${esc(syncMsg)}">${syncErr?'⚠ sync problem':'☁ synced'}</span>`:''}<button id="tm" data-a="tab" data-v="log"></button>`;
 tick();
}

/* ---------- events ---------- */
function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const UI=new Set(['tab','ft','fl','fs','fp','ff','fc','fd','bs','bx','sg','sa','su','rshow','nt','ne','nx','sync-now','sync-off']);
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a,v=b.dataset.v;
 if(UI.has(a))e.preventDefault();
 if(a==='tab'){tab=v;rShow=false}
 else if(a==='ft'){fTopic=v;breakOver=false}
 else if(a==='fl')fLen=+v;
 else if(a==='fs'){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(x){}
  try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(x){}
  T={mode:'focus',topic:fTopic,planned:fLen,end:Date.now()+fLen*6e4,paused:null};breakOver=false;sugOpen=false;saveT()}
 else if(a==='fp'){if(T.paused!=null){T.end=Date.now()+T.paused;T.paused=null}else T.paused=T.end-Date.now();saveT()}
 else if(a==='ff'){const left=T.paused!=null?T.paused:T.end-Date.now();T={mode:'wrap',topic:T.topic,min:Math.max(1,Math.round((T.planned*6e4-left)/6e4))};saveT()}
 else if(a==='fc'){if(!confirm('Cancel this session without logging it?'))return;T=null;saveT()}
 else if(a==='fd'){if(!confirm("Discard this session? It won't be logged."))return;T=null;saveT()}
 else if(a==='bs'){T={mode:'break',end:Date.now()+v*6e4,paused:null};saveT()}
 else if(a==='bx'){T=null;breakOver=false;saveT()}
 else if(a==='sg'){sugOpen=true;sIdx=0}
 else if(a==='sa')sIdx++;
 else if(a==='su'){fTopic=v;sugOpen=false}
 else if(a==='rshow')rShow=true;
 else if(a==='rv'){const [id,k]=v.split('|'),n=S.notes.find(x=>x.id===id);rShow=false;
  if(k==='got'){n.step=Math.min((n.step||0)+1,REVIEW_DAYS.length-1);n.due=addDays(today(),REVIEW_DAYS[n.step])}
  else if(k==='fuzzy'){n.step=0;n.due=addDays(today(),1)}else n.due=null}
 else if(a==='sync-now'){pull();return}
 else if(a==='sync-off'){if(!confirm('Disconnect GitHub sync in this browser? Your data stays here and on GitHub.'))return;SY={};saveSY();syncMsg='';syncErr=false}
 else if(a==='fm'){fMin=+v;const i=document.querySelector('input[name=min]');if(i){i.value=v}return}
 else if(a==='dl')S.logs=S.logs.filter(x=>x.id!==v);
 else if(a==='dr')S.resources=S.resources.filter(x=>x.id!==v);
 else if(a==='dc')S.checks=S.checks.filter(x=>x.id!==v);
 else if(a==='dp')S.clips=S.clips.filter(x=>x.id!==v);
 else if(a==='ad')S.aplus.dom[v]=((S.aplus.dom[v]||0)+1)%3;
 else if(a==='apd'){if(!confirm('Delete this practice score?'))return;S.aplus.practice=S.aplus.practice.filter(x=>x.id!==v)}
 else if(a==='nt'){nTopic=v;nEdit=null}
 else if(a==='ne')nEdit=v;
 else if(a==='nx')nEdit=null;
 else if(a==='nd'){if(!confirm('Delete this note?'))return;S.notes=S.notes.filter(x=>x.id!==v)}
 else if(a==='rs'){const r=S.resources.find(x=>x.id===v);r.status={todo:'doing',doing:'done',done:'todo'}[r.status]}
 else if(a==='cp'){const [id,k]=v.split('|');const c=S.clips.find(x=>x.id===id);c[k]=!c[k]}
 else if(a==='exp'){download(`learning-tracker-${today()}.json`,JSON.stringify(S,null,2));return}
 else if(a==='imp'){$('#imp').click();return}
 else if(a==='reset'){if(!confirm(syncOn()?'Delete ALL data in this browser AND the synced copy on GitHub?':'Delete ALL data in this browser?'))return;S=fresh()}
 if(!UI.has(a))save();render();
});
document.addEventListener('submit',e=>{
 const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
 const d=Object.fromEntries(new FormData(f));
 if(f.dataset.form==='log'){
  const min=Math.max(1,parseInt(d.min)||0);fMin=min;
  addSession(fTopic,d.date,min,d.note,d.rec,d.learned,d.next.trim()?d.next:undefined);
 }else if(f.dataset.form==='wrap'){
  addSession(T.topic,today(),Math.max(1,parseInt(d.min)||1),d.note,d.rec,d.learned,d.next);T={mode:'done'};saveT();
 }else if(f.dataset.form==='sync'){
  SY={owner:d.owner.trim(),repo:d.repo.trim(),token:d.token.trim(),path:'data.json'};saveSY();syncMsg='Connecting…';syncErr=false;render();pull();return;
 }else if(f.dataset.form==='res')S.resources.push({id:uid(),topic:d.topic,title:d.title.trim(),url:d.url.trim(),note:d.note.trim(),status:'todo'});
 else if(f.dataset.form==='chk')S.checks.push({id:uid(),topic:d.topic,date:d.date,score:d.score.trim(),note:d.note.trim()});
 else if(f.dataset.form==='note'){if(!d.body.trim())return;S.notes.push(newNote(nTopic,d.title,d.body));delete drafts[nTopic]}
 else if(f.dataset.form==='nedit'){const n=S.notes.find(x=>x.id===f.dataset.id);if(n&&d.body.trim()){n.title=d.title.trim();n.body=d.body.trim();n.updated=today()}nEdit=null}
 else if(f.dataset.form==='prac'){S.aplus.practice.push({id:uid(),core:d.core,date:d.date,score:String(Math.max(0,Math.min(100,parseInt(d.score)||0))),source:d.source.trim(),weak:d.weak});tab='exam'}
 else if(f.dataset.form==='clip')S.clips.push({id:uid(),topic:d.topic,date:d.date,title:d.title.trim(),edited:false,yt:false,tw:false,ig:false});
 save();render();
});
document.addEventListener('input',e=>{
 const t=e.target;if(t.dataset.draft){(drafts[nTopic]=drafts[nTopic]||{title:'',body:''})[t.dataset.draft]=t.value}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.ax){S.aplus[t.dataset.ax]=t.dataset.ax==='target'?Math.max(1,Math.min(100,parseInt(t.value)||85)):t.value;save();render()}
 else if(t.dataset.set){S.settings[t.dataset.set]=t.value;save();render()}
 else if(t.dataset.goal){S.settings.goals[t.dataset.goal]=Math.max(0,parseInt(t.value)||0);save();render()}
 else if(t.id==='imp'&&t.files[0]){
  const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.settings||!j.logs)throw 0;S=j;migrate();save();render()}catch(x){alert('That file is not a valid backup.')}};
  r.readAsText(t.files[0]);t.value='';
 }
});
render();
if(syncOn())pull();
</script>
</body>
